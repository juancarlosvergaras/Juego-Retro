<!doctype html><meta charset="utf-8"><title>Sprites ambientales</title><style>body{background:#24374a;color:white;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(4,1fr)}canvas{width:100%;image-rendering:pixelated}</style><h1>Aviones · trabajadores · fuego · humo · lluvia · grúa</h1><main></main><script>const img=new Image();img.onload=()=>{for(let r=0;r<8;r++)for(let f=0;f<4;f++){const c=document.createElement('canvas');c.width=c.height=256;document.querySelector('main').append(c);const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(img,f*img.width/4,r*img.height/8,img.width/4,img.height/8,0,0,256,256);}};img.src='/assets/sprites/ambiente-animado-v1.png';</script>
