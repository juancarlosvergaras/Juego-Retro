<!doctype html><meta charset="utf-8"><title>Desembarco del soldado</title>
<style>body{background:#314256;color:white;font:16px sans-serif}main{display:grid;grid-template-columns:repeat(3,1fr)}canvas{width:100%;image-rendering:pixelated}button{padding:12px}</style>
<button onclick="location.reload()">Repetir secuencia</button><main></main>
<script src="/arrival.js"></script><script src="/jeep-atlas.js"></script><script src="/soldier-v2-atlas.js"></script>
<script>
const j=new Image(),p=new Image(),d=new Image();
Promise.all([j,p,d].map(im=>new Promise(r=>im.onload=r))).then(()=>{
 ArcadeArrival.setSprites(j,JEEP_ARRIVAL_FRAMES,p,SOLDIER_V2_FRAMES,SOLDIER_V2_SCALE);
 ArcadeArrival.setDismountSprites(d,SOLDIER_DISMOUNT_FRAMES,SOLDIER_DISMOUNT_SCALE);
 const poses=[['Sentado',1.6],['Se apoya',2.4],['Gira y se incorpora',2.63],['Impulso',2.8],['Salto',3.25],['Aterrizaje',3.95]];
 for(const [label,t] of poses){const el=document.createElement('section');el.innerHTML='<h3>'+label+'</h3><canvas width="300" height="170"></canvas>';document.querySelector('main').append(el);const c=el.querySelector('canvas').getContext('2d'),p={x:210,y:150,anim:0},s=ArcadeArrival.create(p);ArcadeArrival.update(s,p,t);c.fillStyle='#817154';c.fillRect(0,150,300,20);ArcadeArrival.draw(c,s,p);}
 const el=document.createElement('section');el.innerHTML='<h3>Secuencia completa</h3><canvas width="300" height="170"></canvas>';document.querySelector('main').prepend(el);
 const c=el.querySelector('canvas').getContext('2d'),player={x:210,y:150,anim:0},s=ArcadeArrival.create(player);let last=0;
 function tick(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;ArcadeArrival.update(s,player,dt);c.clearRect(0,0,300,170);c.fillStyle='#817154';c.fillRect(0,150,300,20);ArcadeArrival.draw(c,s,player);if(s.visible)requestAnimationFrame(tick);}requestAnimationFrame(tick);
});j.src='/assets/sprites/jeep-llegada-v1.png';p.src='/assets/sprites/soldado-v2.png';d.src='/assets/sprites/soldado-desembarco-v1.png';
</script>
