<!doctype html><meta charset="utf-8"><title>Arsenal detallado · OBRA 10</title>
<style>body{background:#17242e;color:#efdeb5;font:15px system-ui;margin:22px}canvas{display:block;width:960px;max-width:100%;image-rendering:pixelated}p{color:#b5c7c9}</style>
<h2>Arsenal · metal, madera y contornos definidos</h2><p>Detalle ampliado y objeto a tamaño de juego. El hacha conserva el diseño aprobado.</p>
<canvas width="960" height="620"></canvas><output id="checks"></output>
<script src="/weapon-renderer.js"></script><script>
const c=document.querySelector('canvas').getContext('2d'),names=['Cuchillo','Hacha','Pistola','Escopeta','AK','Lanzamisiles','Arco','Ballesta','Granadas'];
const hashes=new Set();let okay=true;
for(let slot=1;slot<=9;slot++){
 const x=((slot-1)%3)*320,y=Math.floor((slot-1)/3)*205;
 c.fillStyle='#21333f';c.fillRect(x+4,y+4,308,192);c.fillStyle='#edd59b';c.font='bold 14px system-ui';c.fillText(slot+' · '+names[slot-1],x+18,y+26);
 c.save();c.translate(x+30,y+47);c.scale(3.5,3.5);ArcadeWeaponRenderer.pickup(c,slot,22,17);c.restore();
 c.fillStyle='#111b28';c.fillRect(x+224,y+87,44,34);c.strokeStyle='#bd9c60';c.lineWidth=1;c.strokeRect(x+223.5,y+86.5,45,35);ArcadeWeaponRenderer.pickup(c,slot,x+246,y+104);
 c.font='10px system-ui';c.fillStyle='#a3b9bc';c.fillText('EN EL MAPA',x+216,y+145);
 const sprite=document.createElement('canvas');sprite.width=44;sprite.height=34;const ctx=sprite.getContext('2d');ArcadeWeaponRenderer.pickup(ctx,slot,22,17);const data=ctx.getImageData(0,0,44,34).data;let count=0;for(let i=3;i<data.length;i+=4)if(data[i])count++;if(count<70)okay=false;hashes.add(sprite.toDataURL());
}
document.querySelector('#checks').textContent=okay&&hashes.size===9?'9 sprites distintos, visibles y dentro de sus celdas.':'ERROR en los sprites';
</script>
