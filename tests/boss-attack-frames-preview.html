<!doctype html><meta charset="utf-8"><title>Revisión de zarpazos</title><style>body{background:#253548;color:white;font:16px sans-serif}main{display:grid;grid-template-columns:repeat(4,1fr)}canvas{width:100%;image-rendering:pixelated}h2{font-size:14px}</style><main></main><script src="/black-wolf-atlas.js"></script><script src="/zombie-wolf-atlas.js"></script><script>
for(const [name,src,atlas,row] of [['Negro','lobo-negro-jefe-v1.png',BLACK_WOLF_FRAMES,1],['Zombi','lobo-zombie-jefe-v1.png',ZOMBIE_WOLF_FRAMES,2]]){const image=new Image();image.onload=()=>{for(let frame=0;frame<4;frame++){const section=document.createElement('section');section.innerHTML='<h2>'+name+' · '+frame+'</h2><canvas width="390" height="340"></canvas>';document.querySelector('main').append(section);const ctx=section.querySelector('canvas').getContext('2d'),[sx,sy,sw,sh,outline]=atlas[row][frame];ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(195,310);if(outline){ctx.beginPath();outline.forEach(([px,py],i)=>ctx[i?'lineTo':'moveTo'](px-sx-sw/2,py-sy-sh));ctx.closePath();ctx.clip();}ctx.drawImage(image,sx,sy,sw,sh,-sw/2,-sh,sw,sh);ctx.restore();}};image.src='/assets/sprites/'+src;}
</script>
