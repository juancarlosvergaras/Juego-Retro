<!doctype html><html lang="es"><base href="/"><meta charset="utf-8"><title>Sprites de jefes · revisión aislada</title><style>body{margin:0;background:#152232;color:#eff7fa;font:14px system-ui}canvas{image-rendering:pixelated;max-width:100%}button{padding:8px;margin:5px}output{display:block}</style><button id="animate">Pausar / animar</button><output id="status">Cargando sprites…</output><canvas width="1200" height="860"></canvas><script src="/white-death-atlas.js"></script><script src="/boss-attack-sprites.js"></script><script src="/advanced-forms.js"></script><script src="/sovereign-animation.js"></script><script>
const c=document.querySelector('canvas').getContext('2d');let running=true,t=0,last=0;document.getElementById('animate').onclick=()=>running=!running;
const paths=['soberano-horror-v2','soberano-ataques-v2','soberano-efectos-v2'];Promise.all([ArcadeAdvancedForms.load(),...paths.map(p=>new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(prepareWhiteDeath(i));i.onerror=reject;i.src='/assets/sprites/'+p+'.png'}))]).then(([,base,attack,fx])=>{
const bf=ArcadeSovereignAnimation.prepare(base,4,[0,318/1182,587/1182,882/1182,1]),af=ArcadeSovereignAnimation.prepare(attack,6,[0,.264,.509,.737,1]),xf=ArcadeAdvancedForms.atlas(fx,4,4,{y:[0,302/1024,518/1024,738/1024,1]});function draw(img,frames,index,x,y,scale,cols){const f=frames[index];c.drawImage(f.image,0,0,f[2],f[3],x+(f[0]-(index%cols+.5)*img.width/cols)*scale,y-f[3]*scale,f[2]*scale,f[3]*scale)}
function loop(now){if(running)t+=(now-last)/1000;last=now;c.fillStyle='#172435';c.fillRect(0,0,1200,860);c.imageSmoothingEnabled=false;c.font='15px system-ui';c.fillStyle='#f9e5b8';c.fillText('Reposo / daño / destrucción',25,25);const index=Math.floor(t*3)%16;draw(base,bf,index,140,285,230/bf[4][3],4);
['lash','wave','laser','pods'].forEach((a,i)=>{const duration=ArcadeSovereignAnimation.durations[a],warning=ArcadeSovereignAnimation.warnings[a],age=t%(duration+warning+.5),pose=ArcadeSovereignAnimation.pose({phase:age<warning?a+'Warn':a,age:age<warning?age:age-warning,hit:0,anim:t});c.fillStyle='#f9e5b8';c.fillText(a,330+i*215,25);draw(attack,af,pose.index,380+i*220,285,210/af[0][3],6);});
Object.keys(ArcadeBossAttackSprites.rows).forEach((kind,i)=>{const x=100+i%6*200,y=400+Math.floor(i/6)*145;c.fillStyle='#e5f4e9';c.fillText(kind,x-40,y-62);ArcadeBossAttackSprites.draw(c,kind,t,x,y,125,80);});
for(let i=0;i<4;i++){const f=xf[i*4+Math.floor(t*7)%4];c.drawImage(fx,...f,25+i*290,645,200,120);}
const p={form:'tank',x:1020,y:810,grounded:t%2>1.6,vy:(t%1.6-.7)*600,tankAirAge:t%1.6,landing:Math.max(0,.24-(t%2-1.6)),anim:t};ArcadeAdvancedForms.draw(c,p);c.fillStyle='#f9e5b8';c.fillText('Tanque: extensión / vuelo / aterrizaje',800,835);document.getElementById('status').textContent='6 hojas nuevas · 116 cuadros · atlas cargados · tiempo '+t.toFixed(1);requestAnimationFrame(loop)}requestAnimationFrame(n=>{last=n;loop(n)});
}).catch(e=>document.getElementById('status').textContent='ERROR '+e);
</script></html>
