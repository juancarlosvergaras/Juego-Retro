<!doctype html><html lang="es"><meta charset="utf-8"><title>Detalle del edificio</title><style>body{margin:0;background:#182a3a}canvas{display:block;width:729px;image-rendering:pixelated}</style><canvas width="729" height="780"></canvas><script src="../physics.js"></script><script src="../building-renderer.js"></script><script>const c=document.querySelector('canvas').getContext('2d'),img=new Image();img.src='../assets/worlds/mundo-01-edificio-v1.png';img.onload=()=>{c.imageSmoothingEnabled=false;const P=ArcadePhysics,R=ArcadeBuildingRenderer,y0=P.EXTENSION.cut+6*169;c.translate(0,-y0);for(let i=6;i<10;i++)R.bay(c,img,P.EXTENSION.cut+i*169,169,i);c.drawImage(img,0,P.EXTENSION.cut,729,2158-P.EXTENSION.cut,0,P.EXTENSION.cut+1690,729,2158-P.EXTENSION.cut);for(const p of P.createPlatforms())if(p.custom)R.platform(c,img,p);for(const l of P.createLadders())if(l.custom)R.ladder(c,img,l);};</script></html>
