<!doctype html><meta charset="utf-8"><title>Murciélagos en los cinco árboles</title><style>body{background:#26343d;color:#e4e8e9;font:18px system-ui;margin:20px}canvas{width:100%;max-width:1200px;image-rendering:pixelated}</style><h1>Seis murciélagos · cinco árboles</h1><canvas width="1200" height="460"></canvas><script src="/cemetery-bat.js"></script><script>
const c=document.querySelector('canvas').getContext('2d'),trees=new Image(),bat=new Image(),B=ArcadeCemeteryBat;trees.src='/assets/sprites/cemetery-trees-v2.png';bat.src='/assets/sprites/cemetery-bat-v1.png';Promise.all([trees.decode(),bat.decode()]).then(()=>{c.imageSmoothingEnabled=false;c.fillStyle='#677783';c.fillRect(0,0,1200,405);B.trees().forEach((t,i)=>{c.save();c.beginPath();c.rect(i*240,0,240,405);c.clip();c.translate(i*240+120,395);c.scale(1.25,1.25);c.translate(-t.x,-620);B.drawTrees(c,trees,{x:t.x-110},220);for(const n of B.createAll().filter(n=>n.treeIndex===i))B.draw(c,n,bat);c.restore();c.fillStyle='#eee';c.font='16px system-ui';c.fillText('Árbol '+(i+1)+' · '+B.createAll().filter(n=>n.treeIndex===i).length+' murciélago(s)',i*240+18,435)})});
</script>
