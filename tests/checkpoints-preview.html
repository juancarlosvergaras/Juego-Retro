<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba de PCs de checkpoint</title><style>body{font:14px system-ui;background:#19272c;color:#e9fff6}button{margin:5px;padding:8px}iframe{width:100%;height:650px;border:0}pre{white-space:pre-wrap}</style><h1>Checkpoints · origen de prueba aislado</h1><button data-scene="one">Obra</button><button data-scene="city">Ciudad</button><button data-scene="cemetery">Cementerio</button><button data-scene="mausoleum">Mausoleo</button><button id="cross">Cruzar la PC</button><button id="die">Probar muerte</button><pre id="status">Selecciona una escena</pre><iframe id="game" title="Prueba de checkpoint"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado');const frame=document.getElementById('game');let observed={},scene='city',kill=false;
for(const b of document.querySelectorAll('[data-scene]'))b.onclick=async()=>{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src='about:blank';});scene=b.dataset.scene;observed={};localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,zombieUnlocked:true,levels:{life:5},owned:[],wallet:0}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:scene==='one'?1:2}));const inventory={selected:3,owned:[1,3],ammo:{3:36}};if(scene==='one'){localStorage.setItem('cap-dollar.mission-one.v1',JSON.stringify({version:1,checkpoint:{x:295,y:3697,floor:0},inventory,hp:10,score:{total:0},form:'soldier'}));frame.src='/index.html';}else{const x=scene==='city'?375:scene==='cemetery'?13805:165;localStorage.setItem('cap-dollar.mission-two.v1',JSON.stringify({x,inside:scene==='mausoleum',landed:true,hp:13,inventory,form:'soldier',defeated:[...Array.from({length:26},(_,i)=>i),...Array.from({length:20},(_,i)=>100+i),...Array.from({length:6},(_,i)=>200+i)],interiorDefeated:[300,301,302,303,304,305,320,321,322,323],tank:{hp:0}}));frame.src='/level-two.html?entry=resume';}};
frame.onload=()=>{const w=frame.contentWindow,cp=w.ArcadeCheckpoints;if(!cp)return;const update=cp.update;cp.update=(s,p,...args)=>{observed.s=s;observed.p=p;return update(s,p,...args);};const powers=w.ArcadePowers,step=powers.update;powers.update=(power,e,p,...args)=>{observed.e=e;const result=step(power,e,p,...args);if(kill){kill=false;e.invincible=0;p.shield=0;w.ArcadeEncounter.hurtPlayer(e,p,p.x-100,false,999);}return result;};};
function resume(){const w=frame.contentWindow,d=w.document;if(!d.getElementById('main-menu').hidden)d.getElementById('menu-play').click();else{const overlay=d.getElementById('level-two-menu')||d.getElementById('overlay');if(!overlay.hidden)(d.getElementById('play-two')||d.getElementById('resume')).click();}return w;}
document.getElementById('cross').onclick=()=>{const w=resume();(w.document.getElementById('level-two')||w.document.getElementById('game')).focus();w.ArcadeControls.setTouch('qa',['right']);setTimeout(()=>w.ArcadeControls.setTouch('qa',[]),520);};
document.getElementById('die').onclick=()=>{const w=resume();(w.document.getElementById('level-two')||w.document.getElementById('game')).focus();kill=true;};
setInterval(()=>{const w=frame.contentWindow,d=w.document,saved=JSON.parse(localStorage.getItem(scene==='one'?'cap-dollar.mission-one.v1':'cap-dollar.mission-two.v1')||'{}');document.getElementById('status').textContent=JSON.stringify({scene,loading:!d.getElementById('level-loading')?.hidden,active:observed.s?.active,saved:saved.checkpoints,position:observed.p?{x:Math.round(observed.p.x),y:Math.round(observed.p.y)}:null,hp:observed.e?.hp,dead:observed.e?.dead},null,1);},150);
document.querySelector('[data-scene="city"]').click();
</script></html>
