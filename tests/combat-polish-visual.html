<!doctype html><html lang="es"><meta charset="utf-8"><link rel="stylesheet" href="/styles.css"><title>Verificación visual de efectos</title><body><h1>Plasma: impacto congelado a 1,2 segundos</h1><canvas id="preview" width="900" height="320"></canvas><button id="loading">Ver carga</button>  <section id="level-loading" class="level-loading" role="dialog" aria-modal="true" aria-label="Cargando nivel"><div class="loading-card"><span class="eyebrow">CAP DOLLAR, THE HUNTER</span><h2>Cargando misión 02 · EL UMBRAL DEL REY</h2><p data-loading-status role="status">Cargando escenario y personajes…</p><progress max="100" value="0" aria-label="Progreso de carga"></progress><strong data-loading-percent>0%</strong><p class="menu-tip">Preparando la próxima cacería.</p><button type="button" class="primary" hidden>Reintentar carga</button></div></section><script src="/level-loading.js"></script><script src="/physics.js"></script><script src="/encounter.js"></script><script src="/zombie-form.js"></script><script src="/mausoleum-king.js"></script><script>

const k=ArcadeMausoleumKing.create();k.rocks=[{x:180,y:250,age:0,target:180},{x:320,y:250,age:.3,target:320},{x:460,y:250,age:.7,target:460}];ArcadeMausoleumKing.drawEffects(c,k);c.fillStyle='#eee';c.fillText('Roca: tres fotogramas del sprite',20,200);
</script></body></html>
