<!doctype html><html lang="es"><meta charset="utf-8"><title>Entrada real M1/M2 · prueba aislada</title><style>body{margin:0;background:#142430;color:white;font:14px sans-serif}button{margin:4px;padding:9px}output{display:block}iframe{width:100%;height:82vh;border:0}</style><button id="m1">Misión 1</button><button id="m2">Misión 2</button><button id="right">↑ → J</button><button id="left">↑ ← J</button><button id="resume">Reanudar y ↑ → J</button><output id="result">Cargando</output><iframe></iframe><script>
if(location.port!=='4186')throw Error('Solo servidor aislado');const frame=document.querySelector('iframe'),out=document.querySelector('output');let mission=2,shots=[];
const key=(type,code,repeat=false)=>{const w=frame.contentWindow;w.dispatchEvent(new w.KeyboardEvent(type,{code,key:code,repeat,bubbles:true,cancelable:true}));};
window.recordShot=(inv,p,result)=>{if(result)shots.push({ammo:inv.ammo[inv.selected],x:p.aim.x,y:p.aim.y});};
async function open(n){mission=n;shots=[];let html=await(await fetch(n===1?'/index.html':'/level-two.html')).text();const inv={selected:3,owned:[1,3],ammo:{3:360}},seed={'cap-dollar.selected-profile.v1':'1','cap-dollar.mission-one.v1':JSON.stringify({version:1,checkpoint:{x:145,y:99999},hp:8,shield:10,inventory:inv}),'cap-dollar.mission-two.v1':JSON.stringify({x:1700,landed:true,hp:8,shield:10,inventory:inv,tank:{hp:0},storm:{hp:0}})};
const setup='const data='+JSON.stringify(seed)+';const storage={getItem:k=>data[k]||null,setItem:(k,v)=>data[k]=String(v),removeItem:k=>delete data[k]};Object.defineProperty(window,"localStorage",{value:storage});Object.defineProperty(window,"sessionStorage",{value:storage});';html=html.replace('<head>','<head><base href="/"><script>'+setup+'</'+'script>');const script=n===1?'game.js':'level-two-game.js',hook='const original=ArcadeArsenal.fire;ArcadeArsenal.fire=(inv,p)=>{const r=original(inv,p);parent.recordShot(inv,p,r);return r;};';html=html.replace('<script src="'+script+'">','<script>'+hook+'</'+'script><script src="'+script+'">');frame.srcdoc=html;out.textContent='M'+n+' cargando';}
frame.onload=()=>{let attempts=0;const timer=setInterval(()=>{const w=frame.contentWindow,b=w.document.getElementById('menu-play');if(b&&!b.disabled){b.click();clearInterval(timer);out.textContent='M'+mission+' lista · espera la llegada del personaje si aparece';}if(++attempts>120)clearInterval(timer);},100)};
function test(side,resume=false){const w=frame.contentWindow;shots=[];const overlay=w.document.getElementById(mission===1?'overlay':'level-two-menu');if(resume&&overlay.hidden)w.document.getElementById(mission===1?'pause':'pause-two').click();if(resume)w.ArcadeControls.poll(performance.now());if(!overlay.hidden)w.document.getElementById(mission===1?'resume':'play-two').click();for(const code of ['ArrowUp',side,'KeyJ'])key('keydown',code);setTimeout(()=>{for(const code of ['KeyJ',side,'ArrowUp'])key('keyup',code);out.textContent='M'+mission+' '+side+' · '+JSON.stringify(shots)+' · '+(shots.length&&shots.every(s=>s.y<0&&Math.sign(s.x)===(side==='ArrowRight'?1:-1))?'CORRECTO':'SIN DISPARO');},700);}
document.getElementById('m1').onclick=()=>open(1);document.getElementById('m2').onclick=()=>open(2);document.getElementById('right').onclick=()=>test('ArrowRight');document.getElementById('left').onclick=()=>test('ArrowLeft');document.getElementById('resume').onclick=()=>test('ArrowRight',true);open(2);
</script></html>
