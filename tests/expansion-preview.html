<!doctype html><html lang="es"><meta charset="utf-8"><title>QA expansión aislada</title><style>body{margin:0;background:#17202c;color:white;font:13px sans-serif}nav{padding:5px}button{margin:3px;padding:7px}iframe{width:100%;height:calc(100vh - 100px);border:0}output{display:block}</style><nav><button data-zone="road">Moto y rampas</button><button data-zone="sea">Mar y tiburón</button><button data-zone="mall">Centro y guardia</button><button data-zone="space">Espacio exterior</button><button data-zone="interior">Interior nave</button><button data-zone="boss">Soberano</button><button id="soldier">Soldado</button><button id="robot">Robot</button><button id="fighter">Luchador</button><button id="wolf">Lobo</button><button id="zombie">Zombi</button><button id="tank">Tanque</button><button id="pose">Caída fija</button><button id="bow">Dos arcos</button><button id="shoot">Disparar</button><button id="power">Poder alien</button><button id="next">Cruzar esclusa</button><button id="win">Derrotar jefe</button><button id="crash">Bache</button><output id="status"></output></nav><iframe id="game"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado 4186');const frame=document.getElementById('game');let view,zone='space',form='soldier',mission=7,hold=false,fixedCrash=false;
async function open(z=zone,f=form){zone=z;form=f;view=null;hold=false;fixedCrash=false;mission=z==='road'?4:z==='sea'?5:z==='mall'?6:7;const word={4:'four',5:'five',6:'six',7:'seven'}[mission],api={4:'Road',5:'Sea',6:'Mall',7:'Space'}[mission];await new Promise(r=>{frame.addEventListener('load',r,{once:true});frame.srcdoc='';});sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');const carry={version:1,level:mission,score:0,hp:8,form,robotUnlocked:true,zombieUnlocked:true,tankUnlocked:true,fighterUnlocked:true,inventory:{owned:[1,2,3,4,5,6,7,8,9],selected:5,secondary:5,ammo:{3:300,4:100,5:900,6:60,7:100,8:50,9:50}}};localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify(carry));localStorage.setItem('obra10.progress.v1',JSON.stringify({...carry,wallet:0,earned:0,owned:['wave','alien'],equipped:'alien',levels:{jump:3}}));const state=mission===4?{road:{distance:430,checkpoint:0}}:mission===5?{sea:{started:true,x:1700,y:860}}:mission===6?{mall:{started:true,floor:1,x:1100,y:472,checkpoint:1}}:{space:{started:true,floor:z==='boss'?2:z==='interior'?1:0,x:z==='boss'?350:1250,y:472,checkpoint:z==='boss'?2:z==='interior'?1:0}};localStorage.setItem('cap-dollar.mission-'+word+'.v1',JSON.stringify({...carry,...state}));let html=await(await fetch('/level-'+word+'.html')).text();html=html.replace('<head>','<head><base href="/">');const hook='const old=Arcade'+api+'Renderer.create;Arcade'+api+'Renderer.create=images=>{const r=old(images);return{...r,draw(c,s,p,e,powers,profile){parent.capture(s,p,e,powers,profile);r.draw(c,s,p,e,powers,profile);}}};';html=html.replace('<script src="level-'+word+'-game.js"></'+'script>','<script>'+hook+'</'+'script><script src="level-'+word+'-game.js"></'+'script>');frame.srcdoc=html;}
window.capture=(s,p,e,powers,profile)=>{view={s,p,e,powers,profile};if(!hold)e.invincible=999;if(fixedCrash&&mission===4){s.crash=1.2;s.crashAge=1.0;}document.getElementById('status').textContent='M'+mission+' '+p.form+' · '+Math.round(p.x)+','+Math.round(p.y)+' · '+(s.distance?.toFixed(0)||s.floor||'')+' · '+s.boss.phase+' · HP '+s.boss.hp+' · salud '+e.hp+' · final '+s.ending.toFixed(1)+' · poderes '+profile.owned.join(',');};
frame.onload=()=>{const timer=setInterval(()=>{const b=frame.contentWindow.document.getElementById('menu-play');if(b&&!b.disabled){clearInterval(timer);b.click();}},100);setTimeout(()=>clearInterval(timer),9000);};const resume=()=>frame.contentWindow.document.getElementById('play-two')?.click();const key=(code,time=250)=>{resume();const w=frame.contentWindow;w.dispatchEvent(new w.KeyboardEvent('keydown',{code,key:code,repeat:false}));setTimeout(()=>w.dispatchEvent(new w.KeyboardEvent('keyup',{code,key:code})),time);};
document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>open(b.dataset.zone));for(const f of ['soldier','robot','fighter','wolf','zombie','tank'])document.getElementById(f).onclick=()=>open(zone,f);document.getElementById('pose').onclick=()=>{fixedCrash=!fixedCrash;hold=false;resume();};document.getElementById('shoot').onclick=()=>key('KeyJ',1500);document.getElementById('power').onclick=()=>key('KeyG');document.getElementById('bow').onclick=()=>{if(view){view.e.inventory.selected=7;view.e.inventory.secondary=7;resume();}};document.getElementById('next').onclick=()=>{if(mission===7&&view.s.floor<2){view.p.x=frame.contentWindow.ArcadeSpaceWorld.widths[view.s.floor]-150;view.p.y=472;view.p.grounded=true;key('ArrowUp');}};document.getElementById('win').onclick=()=>{if(view){view.s.boss.active=true;view.s.boss.hp=0;resume();}};document.getElementById('crash').onclick=()=>{if(mission===4){hold=true;view.e.invincible=0;view.s.hitWait=0;view.s.jump=0;view.s.obstacles=[{distance:view.s.distance+(view.p.x-220)/5,lane:view.p.lane,type:'pothole'}];resume();}};open();
</script></html>
