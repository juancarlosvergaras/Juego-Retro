<!doctype html><html lang="es"><meta charset="utf-8"><title>Transiciones de las tres formas</title>
<style>body{margin:24px;background:#15232e;color:#dce5de;font:15px system-ui}canvas{width:100%;max-width:1200px;image-rendering:pixelated;background:#273a43}button{padding:10px;margin:8px}label{margin:12px}p{max-width:1000px}</style>
<h1>Soldado · Zombi · Lobo</h1><p id="status">Cargando sprites…</p><button id="pause">Pausar</button><button id="mirror">Cambiar dirección</button><label>Velocidad <select id="speed"><option value="1">Normal</option><option value="0.4">Lenta</option></select></label>
<canvas id="scene" width="1200" height="750"></canvas>
<script src="../impact-effects.js"></script><script src="../form-transition.js"></script><script src="../zombie-form.js"></script><script src="../soldier-v2-atlas.js"></script><script src="../soldier-animation.js"></script><script src="../action-atlas.js"></script><script src="../white-death-atlas.js"></script><script>
const T=ArcadeFormTransition,Z=ArcadeZombieForm,paths={morph:'transformaciones-jugador-v3.png',soldier:'soldado-v2.png',wolf:'soldado-lobo-v1.png',wolfIdle:'lobo-reposo-patadas-v2.png',zombie:'zombi-soldado-v1.png',extra:'zombi-soldado-extra-v1.png'},images={},canvas=document.getElementById('scene'),c=canvas.getContext('2d');let age=0,last=0,paused=false,facing=1,rows;
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Continuar':'Pausar';};document.getElementById('mirror').onclick=()=>facing*=-1;
Promise.all(Object.entries(paths).map(([k,path])=>new Promise((ok,bad)=>{const im=new Image();im.onload=()=>{images[k]=prepareWhiteDeath(im);ok();};im.onerror=bad;im.src='../assets/sprites/'+path;}))).then(()=>{
 rows=T.setSheet(images.morph);Z.setPlayerSheets(images.zombie,images.extra);Z.setForms(images.soldier,SOLDIER_V2_FRAMES[0][0],images.wolf,ACTION_FRAMES.wolf[0][7]);T.setEndpoint('wolf',images.wolfIdle,ArcadeSoldierAnimation.wolfActionFrames[0][0],66.03);document.getElementById('status').textContent='18 poses nuevas · 6 direcciones · Pies anclados · Misma lógica de dibujo en ambas misiones';requestAnimationFrame(frame);
});
function frame(now){if(!paused)age+=Math.min(.05,(now-last)/1000||0)*Number(document.getElementById('speed').value);last=now;c.clearRect(0,0,1200,750);c.imageSmoothingEnabled=false;c.font='17px system-ui';c.fillStyle='#dce5de';
 const pairs=T.PAIRS.flatMap(([a,b])=>[[a,b],[b,a]]);for(let i=0;i<6;i++){const [from,to]=pairs[i],x=100+i*200,y=210,t=age%2.2,transform=t<1.2?1.2-t:.001;c.fillStyle='#dce5de';c.fillText(Z.label(from)+' → '+Z.label(to),x-86,32);c.fillStyle='#839589';c.fillRect(x-80,y,160,2);c.save();c.translate(x,y);c.scale(2,2);Z.drawPlayer(c,{x:0,y:0,facing,form:to,transformFrom:from,transform});c.restore();}
 for(let r=0;r<3;r++){const [from,to]=T.PAIRS[r],y=390+r*170;c.fillStyle='#dce5de';c.fillText(Z.label(from)+' → '+Z.label(to),20,y-140);for(let i=0;i<8;i++){const t=i===0?0:i===7?.999:.07+(i-.5)*.85/6,x=72+i*150;c.fillStyle='#839589';c.fillRect(x-55,y,110,1);c.save();c.translate(x,y);c.scale(1.65,1.65);Z.drawPlayer(c,{x:0,y:0,facing,form:to,transformFrom:from,transform:1.2*(1-t)});c.restore();}}
 requestAnimationFrame(frame);
}
</script></html>
