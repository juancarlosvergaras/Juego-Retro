<!doctype html><html lang="es"><meta charset="utf-8"><title>Xbox · navegación de menús</title><style>body{background:#182832;color:white;font:14px sans-serif}button{padding:7px;margin:3px}iframe{width:100%;height:720px;border:0}#status{white-space:pre-wrap}</style><h1>Xbox · mando simulado en páginas reales</h1><button data-page="index.html">Misión 1</button><button data-page="level-two.html">Misión 2</button><button data-pad="13">↓ Cruceta</button><button data-pad="12">↑ Cruceta</button><button data-pad="15">→ Cruceta</button><button data-pad="14">← Cruceta</button><button data-pad="0">A</button><button data-pad="1">B</button><button data-pad="9">Menú</button><button id="lose-focus">Quitar selección</button><pre id="status"></pre><iframe id="game" title="Juego con mando Xbox"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado');const frame=document.getElementById('game');
document.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')e.preventDefault();});
localStorage.setItem('cap-dollar.controls.v1',JSON.stringify({mode:'auto'}));localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.setItem('cap-dollar.selected-profile.v1','1');
for(const b of document.querySelectorAll('[data-page]'))b.onclick=async()=>{const source=await(await fetch('/'+b.dataset.page)).text();frame.srcdoc=source.replace('<head>','<head><base href="/">').replace('<script src="controls.js">','<script>window.qaPad={connected:true,index:0,id:"Xbox simulado",mapping:"standard",axes:[0,0,0,0],buttons:Array.from({length:16},()=>({pressed:false,value:0}))};Object.defineProperty(navigator,"getGamepads",{value:()=>[window.qaPad]});<\/script><script src="controls.js">');};
for(const b of document.querySelectorAll('[data-pad]'))b.onclick=()=>{const w=frame.contentWindow;w.focus();const pad=w.qaPad;if(!pad)return;pad.buttons.forEach(b=>{b.pressed=false;b.value=0;});setTimeout(()=>{pad.buttons[Number(b.dataset.pad)]={pressed:true,value:1};setTimeout(()=>pad.buttons.forEach(b=>{b.pressed=false;b.value=0;}),130);},70);};
document.getElementById('lose-focus').onclick=()=>{frame.contentWindow.focus();frame.contentDocument.activeElement?.blur();};
setInterval(()=>{const d=frame.contentDocument,a=d?.activeElement;if(d)document.getElementById('status').textContent='Selección: '+(a?.id||a?.textContent?.trim().slice(0,55))+' | Menú visible: '+!d.getElementById('main-menu')?.hidden;},100);document.querySelector('[data-page]').click();
</script></html>
