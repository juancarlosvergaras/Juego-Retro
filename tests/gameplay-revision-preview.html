<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión de jugabilidad</title><style>body{background:#18232a;color:#eee;font:14px system-ui;margin:10px}button{margin:4px;padding:7px}iframe{width:100%;height:620px;border:0}canvas{background:#647578;width:100%;max-width:1200px;image-rendering:pixelated}pre{white-space:pre-wrap}</style><h1>Prueba aislada · jugabilidad</h1><div id="buttons"></div><pre id="status"></pre><iframe id="game" title="Juego de prueba"></iframe><h2>Ocho poses de salto · escala del juego</h2><canvas id="wolf" width="1200" height="100"></canvas><h2>Vehículos: original, 3 impactos, 6 impactos, 10 impactos</h2><canvas id="cars" width="1200" height="380"></canvas><script src="../white-death-atlas.js"></script><script src="../soldier-animation.js"></script><script src="../level-two.js"></script><script src="../wrecked-cars.js"></script><script>
if(location.port!=='4186')throw Error('Solo pruebas aisladas');
const frame=document.getElementById('game'),status=document.getElementById('status');let scene='Menú 1',p;
const modes={'Menú 1':'index.html','Menú 2':'level-two.html','Paracaídas':'level-two.html?entry=select','Muro':'level-two.html?entry=resume','Lobo':'level-two.html?entry=resume','Carro':'level-two.html?entry=resume'};
for(const [name,url] of Object.entries(modes)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{scene=name;p=null;localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,zombieUnlocked:true,levels:{life:5,jump:5},owned:[],wallet:0}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:name==='Menú 1'?1:2}));localStorage.setItem('cap-dollar.mission-two.v1',JSON.stringify({x:name==='Muro'?4400:name==='Carro'?1170:180,landed:true,form:name==='Lobo'?'wolf':'soldier',hp:13,zombieUnlocked:true,cars:[10,10,10,10],tank:{hp:name==='Muro'?72:0},defeated:Array.from({length:26},(_,i)=>i),inventory:{selected:3,owned:[1,3],ammo:{3:300}}}));frame.src='/'+url;};document.getElementById('buttons').append(b);}
for(const [name,ids,ms] of [['Saltar corriendo',['right','run','jump'],1000],['Embestir',['right','run','fire'],650],['Bajar rápido',['down'],1700],['10 disparos',['fire'],2800]]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{const w=frame.contentWindow;w.ArcadeControls.setTouch('qa',ids);setTimeout(()=>w.ArcadeControls.setTouch('qa',[]),ms);};document.getElementById('buttons').append(b);}
frame.onload=()=>{const w=frame.contentWindow;if(w.ArcadePhysics){const step=w.ArcadePhysics.step;w.ArcadePhysics.step=function(player,...args){if(!player.kind)p=player;return step(player,...args);};}};
setInterval(()=>{try{const w=frame.contentWindow,d=w.document;status.textContent=JSON.stringify({scene,loading:!d.getElementById('level-loading')?.hidden,menu:!d.getElementById('main-menu')?.hidden,spriteRequests:w.performance.getEntriesByType('resource').filter(r=>r.name.includes('/assets/sprites/')).length,player:p?{x:Math.round(p.x),y:Math.round(p.y),form:p.form,jump:p.wolfSprintJump,ram:!!p.ram,cooldown:p.formCooldown}:null},null,1);}catch{}},200);
async function image(path){const i=new Image();i.src='../assets/sprites/'+path;await i.decode();return prepareWhiteDeath(i);}
Promise.all([image('lobo-salto-carrera-v1.png'),image('carros-dano-v1.png'),image('carros-destruidos-v1.png')]).then(([wolf,damage,original])=>{let c=document.getElementById('wolf').getContext('2d');c.imageSmoothingEnabled=false;ArcadeSoldierAnimation.wolfJumpFrames[0].forEach((f,i)=>c.drawImage(wolf,...f.slice(0,4),i*148+10,85-f[3]*.24,f[2]*.24,f[3]*.24));c=document.getElementById('cars').getContext('2d');c.imageSmoothingEnabled=false;const cars=ArcadeWreckedCars.restore(ArcadeLevelTwo.wreckedCars());cars.forEach((car,r)=>[10,7,4,0].forEach((hp,col)=>ArcadeWreckedCars.draw(c,{...car,hp,x:col*260+30,y:r*94+90},damage,original)));});
document.querySelector('button').click();
</script></html>
