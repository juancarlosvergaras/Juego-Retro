<!doctype html><meta charset="utf-8"><title>Rescate: fondo fijo y puerta lateral</title>
<style>body{background:#253548;color:#eee;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(3,1fr)}canvas{width:100%;image-rendering:pixelated}</style><main></main>
<script src="/helicopter-atlas.js"></script><script src="/soldier-v2-atlas.js"></script><script src="/action-atlas.js"></script><script src="/extraction.js"></script><script>
const a=new Image(),d=new Image(),soldier=new Image(),wolf=new Image();
Promise.all([a,d,soldier,wolf].map(im=>new Promise(r=>im.onload=r))).then(()=>{
 ArcadeExtraction.setSpriteSheet(a,HELICOPTER_FRAMES);ArcadeExtraction.setDoorSprite(d);
 ArcadeExtraction.setPassengerSprites(soldier,SOLDIER_V2_FRAMES[0][0],wolf,ACTION_FRAMES.wolf[0][7]);
 for(const form of ['soldier','wolf'])for(const door of [0,.15,.4,.7,.95,1]){
  const box=document.createElement('section');box.innerHTML='<h3>'+form+' · cierre '+Math.round(door*100)+'%</h3><canvas width="260" height="160"></canvas>';document.querySelector('main').append(box);
  const ctx=box.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
  // Close-up of the same opening through all six rotor frames.
  let start;
  function render(t){start??=t;ctx.clearRect(0,0,260,160);ctx.save();ctx.scale(1.8,1.8);ArcadeExtraction.draw(ctx,{x:130,y:76,t:6+(t-start)/1000,boardAt:5.8,boarded:door>0,door,form});ctx.restore();requestAnimationFrame(render);}requestAnimationFrame(render);
 }
});a.src='/assets/sprites/helicoptero-rescate-v3.png';d.src='/assets/sprites/helicoptero-puerta-cerrada-v1.png';soldier.src='/assets/sprites/soldado-v2.png';wolf.src='/assets/sprites/soldado-lobo-v1.png';
</script>
