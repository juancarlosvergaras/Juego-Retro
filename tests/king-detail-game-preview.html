<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión del rey en misión 2</title><style>body{background:#18282c;color:#fff;font:14px sans-serif}button{padding:8px;margin:3px}iframe{width:100%;height:690px;border:0}</style><h1>Rey · prueba aislada</h1><button data-phase="roar">Repetir transformación</button><button data-phase="walk">Caminar</button><button data-phase="vomit">Plasma</button><button data-phase="leap">Salto</button><button data-phase="claw">Garras</button><button data-phase="death">Derrota</button><pre id="status">Cargando</pre><iframe id="game" title="Misión 2"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado');const f=document.getElementById('game');let observed,selected='roar';
localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');
localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,levels:{life:5,jump:5},owned:[],shield:99}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:2}));
localStorage.setItem('cap-dollar.mission-two.v1',JSON.stringify({inside:true,x:1570,landed:true,hp:13,shield:99,form:'soldier',interiorDefeated:[300,301,302,303,304,305,320,321,322,323],king:{stage:2,active:true,x:1870,phase:'roar'},inventory:{selected:3,owned:[1,3],ammo:{3:300}}}));
f.onload=()=>{const w=f.contentWindow,K=w.ArcadeMausoleumKing;if(!K)return;const update=K.update;K.update=(k,p,dt,hurt,enemies)=>{observed=k;if(k.phase==='vomit'&&k.age>=1.6)return;const result=update(k,p,dt,()=>{},enemies);k.cooldown=100;document.getElementById('status').textContent=k.phase+' · '+k.age.toFixed(2)+' s · altura '+k.h.toFixed(1);return result;};};f.src='/level-two.html?entry=resume';
for(const b of document.querySelectorAll('[data-phase]'))b.onclick=()=>{if(!observed)return;const w=f.contentWindow,k=observed;k.stage=2;k.phase=b.dataset.phase;k.age=0;k.y=620;k.hp=120;k.defeated=false;k.active=true;k.facing=-1;k.fired=false;k.streamClock=0;k.startX=1870;k.targetX=1800;k.x=1870;k.cycle=0;k.pools=[];k.fluid=[];const menu=w.document.getElementById('level-two-menu');if(!menu.hidden)w.document.getElementById('play-two').click();};
</script></html>
