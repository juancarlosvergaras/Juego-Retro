<!doctype html><html><meta charset="utf-8"><title>Escaleras revisadas</title><style>body{margin:0;background:#182a3a}canvas{width:500px;image-rendering:pixelated}</style><canvas width="729" height="2158"></canvas><script src="../physics.js"></script><script src="../building-renderer.js"></script><script>const c=document.querySelector('canvas').getContext('2d'),img=new Image();img.src='../assets/worlds/mundo-01-edificio-v1.png';img.onload=()=>{const R=ArcadeBuildingRenderer,P=ArcadePhysics;c.imageSmoothingEnabled=false;c.drawImage(R.cleanArtwork(img),0,0);for(const l of P.createLadders().filter(l=>!l.custom)){const unmap=y=>y>=P.EXTENSION.cut+P.EXTENSION.height?y-P.EXTENSION.height:y;R.ladder(c,img,{x:l.x,top:unmap(l.top),bottom:unmap(l.bottom)});}};</script></html>
