<!doctype html><html lang="es"><meta charset="utf-8"><title>Rey · Sprites del mausoleo</title><style>body{background:#252f36;color:#eee;font:16px system-ui;margin:12px}button{padding:9px;margin:3px}canvas{width:100%;max-width:1200px;image-rendering:pixelated}</style><h1>Rey del mausoleo · Secuencias de animación</h1><div id="buttons"></div><p id="status">Cargando sprites…</p><canvas id="c" width="1200" height="850"></canvas>
<script src="/impact-effects.js"></script><script src="/physics.js"></script><script src="/cemetery-zombies.js"></script><script src="/cemetery-bat.js"></script><script src="/mausoleum-king.js"></script><script src="/white-death-atlas.js"></script><script>
const K=ArcadeMausoleumKing,c=document.getElementById('c').getContext('2d'),atlases={};let key='kingStone',dir=1,time=0;
for(const [label,value]of [['Piedra','kingStone'],['Transformación','kingTransform'],['Zombi','kingZombie'],['Girar','flip']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(value==='flip')dir*=-1;else key=value};document.getElementById('buttons').append(b)}
Promise.all([['kingStone','rey-piedra-v2.png'],['kingTransform','rey-transformacion-v1.png'],['kingZombie','rey-zombi-v3.png'],['kingZombieLegacy','rey-zombi-v2.png']].map(([key,path])=>new Promise(resolve=>{const image=new Image();image.onload=()=>{atlases[key]=K.prepareAtlas(prepareWhiteDeath(image),key==='kingTransform'?2:5,key);resolve()};image.src='/assets/sprites/'+path}))).then(()=>{
 const phases={kingStone:['descend','walk','sword','stomp','rock'],kingTransform:['crack','roar'],kingZombie:['walk','vomit','leap','claw','death']};
 function frame(now){time=now/1000;c.fillStyle='#252f36';c.fillRect(0,0,1200,850);c.imageSmoothingEnabled=false;const a=atlases[key];
 for(let row=0;row<a.frames.length;row++){c.fillStyle='#d9cfad';c.font='14px system-ui';c.fillText(phases[key][row],8,20+row*155);for(let i=0;i<6;i++){const f=a.frames[row][i],s=a.scale*.47,x=95+i*165,y=148+row*155;c.fillStyle='#546260';c.fillRect(x-78,y,156,1);c.save();c.translate(x,y);c.scale(dir,1);c.drawImage(a.image,f.x,f.y,f.w,f.h,(f.x-f.pivot)*s,(f.y-f.base)*s,f.w*s,f.h*s);c.restore();}
 const phase=phases[key][row],duration=K.durations[phase]||1,k={stage:key==='kingStone'?1:2,phase,age:time%duration,cycle:time*.7,x:1100,y:148+row*155,facing:dir};c.save();c.translate(1100,148+row*155);c.scale(.47,.47);k.x=k.y=0;K.draw(c,k,atlases);c.restore();}
 document.getElementById('status').textContent=key+' · '+a.frames.flat().length+' fotogramas · escala fija '+a.scale.toFixed(2);requestAnimationFrame(frame)}requestAnimationFrame(frame);
});</script></html>
