<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba del inicio del rey</title><style>body{background:#18282c;color:#fff;font:14px system-ui}button{padding:8px;margin:5px}iframe{width:100%;height:710px;border:0}</style><h1>Mausoleo · prueba aislada</h1><button data-scene="center">Dos plataformas centrales</button><button data-scene="blocked">Llegada con zombi vivo</button><button data-scene="clear">Llegada despejada</button><pre id="status"></pre><iframe id="game" title="Mausoleo"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado');const frame=document.getElementById('game');let scene='center',observed={};
for(const button of document.querySelectorAll('[data-scene]'))button.onclick=async()=>{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src='about:blank';});scene=button.dataset.scene;observed={};localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,levels:{life:5,jump:5},owned:[],shield:99}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:2}));localStorage.setItem('cap-dollar.mission-two.v1',JSON.stringify({inside:true,x:scene==='center'?1200:1900,landed:true,hp:13,shield:99,form:'soldier',interiorDefeated:[300,301,302,303,305,320,321,322,323,...(scene==='blocked'?[]:[304])],king:{},inventory:{selected:3,owned:[1,3],ammo:{3:300}}}));frame.src='/level-two.html?entry=resume';};
frame.onload=()=>{const w=frame.contentWindow,K=w.ArcadeMausoleumKing;if(!K)return;const update=K.update;K.update=(k,p,dt,hurt,enemies)=>{const result=update(k,p,dt,hurt,enemies);observed={scene,platforms:w.ArcadeLevelTwo.scaffolds().map(s=>({x:s.x,w:s.w})),phase:k?.phase,age:k?.age,x:p.x,livingZombies:enemies.filter(n=>n.kind==='zombie'&&n.hp>0).length};document.getElementById('status').textContent=JSON.stringify(observed,null,1);if(k?.phase==='descend'&&k.age>=1.5)w.document.getElementById('pause-two').click();return result;};};document.querySelector('[data-scene="center"]').click();
</script></html>
