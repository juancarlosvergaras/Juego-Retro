<!doctype html><html lang="es"><meta charset="utf-8"><title>QA Misión 5 aislada</title><style>body{margin:0;background:#102432;color:#dbf5ee;font:13px sans-serif}nav{padding:4px}button{margin:3px;padding:6px}iframe{width:100%;height:calc(100vh - 85px);border:0}output{display:block}</style><nav><button id="intro">Introducción</button><button id="sea">Mar</button><button id="deep">Profundidades</button><button id="door">Entrar al submarino</button><button id="arena">Capitán</button><button id="soldier">Soldado</button><button id="wolf">Lobo</button><button id="zombie">Zombi</button><button id="robot">Robot</button><button id="tank">Mini tanque</button><button id="fighter">Luchador</button><button id="shoot">Disparar</button><button id="kick">Patada</button><button id="win">Final 5</button><button id="road">Recompensa 4</button><output id="status"></output></nav><iframe id="game"></iframe><script>
if(location.port!=='4186')throw Error('Usar origen aislado 4186');const frame=document.getElementById('game');let view,kind=5;
async function open({form='tank',inside=false,x=1500,y=850,intro=false,mission=5}={}){view=null;kind=mission;await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.srcdoc='';});sessionStorage.setItem('cap-dollar.selected-profile.v1','1');const carry={version:1,level:mission,score:9000,hp:8,robotUnlocked:true,zombieUnlocked:true,tankUnlocked:true,fighterUnlocked:true,inventory:{owned:[1,2,3,4,5,6,7,8,9],selected:5,secondary:3,ammo:{3:300,4:100,5:900,6:60,7:50,8:50,9:50}}};localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify(carry));localStorage.setItem('obra10.progress.v1',JSON.stringify({...carry,wallet:9000,earned:9000,owned:['heal','wave','orbital'],equipped:'wave',levels:{jump:2}}));localStorage.setItem('cap-dollar.mission-five.v1',JSON.stringify({...carry,form,sea:{started:!intro,x:inside?180:x,y,inside,checkpoint:inside?3:0}}));localStorage.setItem('cap-dollar.mission-four.v1',JSON.stringify({...carry,form:'soldier',road:{distance:6600,ending:true,awarded:['road-rig']}}));let html=await(await fetch(mission===5?'/level-five.html':'/level-four.html')).text();html=html.replace('<head>','<head><base href="/">');const api=mission===5?'ArcadeSeaRenderer':'ArcadeRoadRenderer',source=mission===5?'level-five-game.js':'level-four-game.js';const hook='const old='+api+'.create;'+api+'.create=(images)=>{const r=old(images);return{...r,draw(c,s,p,e,powers,profile){parent.capture(s,p,e);r.draw(c,s,p,e,powers,profile);}}};';html=html.replace('<script src="'+source+'"></'+'script>','<script>'+hook+'</'+'script><script src="'+source+'"></'+'script>');frame.srcdoc=html;}
window.capture=(s,p,e)=>{if(kind===5&&!s.stars||kind===4&&!s.collected)return;view={s,p,e};e.invincible=999;document.getElementById('status').textContent=(kind===5?'M5 '+(s.inside?'INTERIOR':'MAR'):'M4')+' · '+p.form+' · '+Math.round(p.x)+','+Math.round(p.y)+' · '+s.boss.phase+' HP '+Math.ceil(s.boss.hp)+' · final '+s.ending.toFixed(1);};
frame.onload=()=>{const timer=setInterval(()=>{const b=frame.contentWindow.document.getElementById('menu-play');if(b&&!b.disabled){clearInterval(timer);b.click();}},100);setTimeout(()=>clearInterval(timer),6000);};
const resume=()=>frame.contentWindow.document.getElementById('play-two')?.click();
for(const id of ['soldier','wolf','zombie','robot','tank','fighter'])document.getElementById(id).onclick=()=>open({form:id,inside:view?.s.inside||false});
document.getElementById('intro').onclick=()=>open({intro:true,x:180,y:300});document.getElementById('sea').onclick=()=>open();document.getElementById('deep').onclick=()=>open({x:5960,y:2080});document.getElementById('door').onclick=()=>{if(view&&kind===5){view.p.x=6200;view.p.y=2100;resume();}};document.getElementById('arena').onclick=()=>open({inside:true});
for(const [id,code]of [['shoot','KeyJ'],['kick','KeyL']])document.getElementById(id).onclick=()=>{const w=frame.contentWindow;resume();w.dispatchEvent(new w.KeyboardEvent('keydown',{code,key:code.slice(-1).toLowerCase()}));setTimeout(()=>w.dispatchEvent(new w.KeyboardEvent('keyup',{code,key:code.slice(-1).toLowerCase()})),1000);};document.getElementById('win').onclick=()=>{if(view?.s.inside){view.s.boss.hp=0;resume();}};document.getElementById('road').onclick=()=>open({mission:4});open();
</script></html>
