<!doctype html><html lang="es"><meta charset="utf-8"><title>QA Misión 4 aislada</title><style>body{margin:0;background:#182831;color:white;font:13px sans-serif}nav{padding:5px}button{margin:3px;padding:6px}iframe{width:100%;height:calc(100vh - 85px);border:0}output{display:block}</style><nav><button id="road">Carretera</button><button id="intro">Introducción</button><button id="wolf">Lobo</button><button id="zombie">Zombi</button><button id="robot">Robot</button><button id="boss">Jefe</button><button id="break">Romper blindaje</button><button id="end">Final 4</button><button id="end3">Final 3</button><button id="end3pose">Ver extracción</button><button id="end4pose">Ver explosión</button><button id="shoot">Disparar</button><output id="status"></output></nav><iframe id="game"></iframe><script>
if(location.port!=='4186')throw Error('Usar puerto aislado 4186');const frame=document.getElementById('game');let view=null,kind=4,hold=null;
async function open(form='soldier',distance=1600,intro=false,mission=4){view=null;kind=mission;hold=null;frame.srcdoc='';await new Promise(r=>setTimeout(r,100));sessionStorage.setItem('cap-dollar.selected-profile.v1','1');const carry={version:1,level:mission,score:9000,hp:8,robotUnlocked:true,zombieUnlocked:true,inventory:{owned:[1,2,3,4,5,6,7,8,9],selected:5,secondary:3,ammo:{3:300,4:100,5:900,6:60,7:50,8:50,9:50}}};localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify(carry));localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,wallet:9000,earned:9000,zombieUnlocked:true,robotUnlocked:true,owned:['heal','wave','orbital'],equipped:'wave',levels:{jump:2}}));localStorage.setItem('cap-dollar.mission-four.v1',JSON.stringify({...carry,form,road:{distance:intro?0:distance,checkpoint:0}}));localStorage.setItem('cap-dollar.mission-three.v1',JSON.stringify({...carry,x:7480,landed:true,mecha:{defeated:true},form:'robot',ending:true}));let html=await(await fetch(mission===4?'/level-four.html':'/level-three.html')).text();html=html.replace('<head>','<head><base href="/">');const before=mission===4?'level-four-game.js':'level-three-game.js';const hook=mission===4?'const old=ArcadeRoadRenderer.create;ArcadeRoadRenderer.create=(images)=>{const r=old(images);return{...r,draw(c,s,p,e,powers,profile){parent.capture(s,p,e);r.draw(c,s,p,e,powers,profile);}}};':'const old=ArcadeLevelThreeRenderer.create;ArcadeLevelThreeRenderer.create=(images)=>{const r=old(images);return{draw(c,s,cam,w,h,load){parent.capture(s,s.player,s.combat);r.draw(c,s,cam,w,h,load);}}};';html=html.replace('<script src="'+before+'"></'+'script>','<script>'+hook+'</'+'script><script src="'+before+'"></'+'script>');frame.srcdoc=html;}
window.capture=(s,p,e)=>{if(kind===4&&!Number.isFinite(s.distance)||kind===3&&!Number.isFinite(s.endingAge))return;view={s,p,e};if(hold!==null){if(kind===3)s.endingAge=hold;else s.ending=hold;}e.invincible=999;document.getElementById('status').textContent=kind===4?'Distancia '+s.distance.toFixed(0)+' · '+p.form+' · '+s.enemies.length+' enemigos · jefe '+s.boss.phase+' HP '+s.boss.hp+' · final '+s.ending.toFixed(1):'Final 3 '+s.endingAge.toFixed(1);};frame.onload=()=>{const timer=setInterval(()=>{const w=frame.contentWindow,b=w.document.getElementById('menu-play');if(b&&!b.disabled){clearInterval(timer);b.click();}},100);setTimeout(()=>clearInterval(timer),6000);};
document.getElementById('end3pose').onclick=()=>{if(kind===3){hold=4.5;frame.contentWindow.document.getElementById('play-two')?.click();}};document.getElementById('end4pose').onclick=()=>{if(kind===4){view.s.boss.active=true;view.s.boss.hp=0;hold=2;frame.contentWindow.document.getElementById('play-two')?.click();}};document.getElementById('road').onclick=()=>open();document.getElementById('intro').onclick=()=>open('soldier',0,true);for(const f of ['wolf','zombie','robot'])document.getElementById(f).onclick=()=>open(f);document.getElementById('boss').onclick=()=>open('soldier',6600);document.getElementById('break').onclick=()=>{if(view&&kind===4){view.s.boss.hp=Math.max(1,view.s.boss.hp-65);frame.contentWindow.document.getElementById('play-two').click();}};document.getElementById('end').onclick=()=>{if(view&&kind===4){view.s.boss.active=true;view.s.boss.hp=0;frame.contentWindow.document.getElementById('play-two').click();}};document.getElementById('end3').onclick=()=>open('robot',0,false,3);document.getElementById('shoot').onclick=()=>{const w=frame.contentWindow;w.document.getElementById('play-two').click();w.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyJ',key:'j'}));setTimeout(()=>w.dispatchEvent(new w.KeyboardEvent('keyup',{code:'KeyJ',key:'j'})),1000);};open();
</script></html>
