<!doctype html><html lang="es"><meta charset="utf-8"><title>QA Misión 6 aislada</title><style>body{margin:0;background:#102432;color:#dbf5ee;font:13px sans-serif}nav{padding:4px}button{margin:3px;padding:6px}iframe{width:100%;height:calc(100vh - 85px);border:0}output{display:block}</style><nav><button id="intro">Introducción</button><button id="shop">Tienda Arcade</button><button id="stairs">Escalera</button><button id="floor2">Planta 2</button><button id="floor3">Planta 3</button><button id="roof">Azotea</button><button id="soldier">Soldado</button><button id="wolf">Lobo</button><button id="zombie">Zombi</button><button id="tank">Mini tanque</button><button id="fighter">Luchador</button><button id="robot">Robot</button><button id="hero">Centella</button><button id="shoot">Disparar</button><button id="win">Final</button><output id="status"></output></nav><iframe id="game"></iframe><script>
if(location.port!=='4186')throw Error('Usar origen aislado 4186');const frame=document.getElementById('game');let view;
async function open({form='soldier',floor=0,x=980,intro=false}={}){view=null;await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.srcdoc='';});sessionStorage.setItem('cap-dollar.selected-profile.v1','1');const carry={version:1,level:6,score:9000,hp:8,robotUnlocked:true,zombieUnlocked:true,tankUnlocked:true,fighterUnlocked:true,heroUnlocked:true,inventory:{owned:[1,2,3,4,5,6,7,8,9],selected:5,secondary:3,ammo:{3:300,4:100,5:900,6:60,7:50,8:50,9:50}}};localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify(carry));localStorage.setItem('obra10.progress.v1',JSON.stringify({...carry,wallet:9000,earned:9000,owned:['heal','wave','orbital'],equipped:'wave',levels:{jump:2}}));localStorage.setItem('cap-dollar.mission-six.v1',JSON.stringify({...carry,form,mall:{started:!intro,x,y:472,floor,checkpoint:floor}}));let html=await(await fetch('/level-six.html')).text();html=html.replace('<head>','<head><base href="/">');const hook='const old=ArcadeMallRenderer.create;ArcadeMallRenderer.create=(images)=>{const r=old(images);return{...r,draw(c,s,p,e,powers,profile){parent.capture(s,p,e);r.draw(c,s,p,e,powers,profile);}}};';html=html.replace('<script src="level-six-game.js"></'+'script>','<script>'+hook+'</'+'script><script src="level-six-game.js"></'+'script>');frame.srcdoc=html;}
window.capture=(s,p,e)=>{view={s,p,e};e.invincible=999;document.getElementById('status').textContent='M6 · Planta '+(s.floor+1)+' · '+p.form+' · '+Math.round(p.x)+','+Math.round(p.y)+' · '+s.boss.phase+' HP '+Math.ceil(s.boss.hp)+' · final '+s.ending.toFixed(1);};
frame.onload=()=>{const timer=setInterval(()=>{const b=frame.contentWindow.document.getElementById('menu-play');if(b&&!b.disabled){clearInterval(timer);b.click();}},100);setTimeout(()=>clearInterval(timer),7000);};
const resume=()=>frame.contentWindow.document.getElementById('play-two')?.click();for(const id of ['soldier','wolf','zombie','tank','fighter','robot','hero'])document.getElementById(id).onclick=()=>open({form:id,floor:view?.s.floor||0,x:view?.p.x||980});
document.getElementById('intro').onclick=()=>open({intro:true,x:140});document.getElementById('shop').onclick=()=>open();document.getElementById('stairs').onclick=()=>{const w=frame.contentWindow, floor=Math.min(view?.s.floor||0,2);open({floor,form:view?.p.form||'soldier',x:w.ArcadeMallWorld.escalator(floor).entry});};document.getElementById('floor2').onclick=()=>open({floor:1,x:140});document.getElementById('floor3').onclick=()=>open({floor:2,x:140});document.getElementById('roof').onclick=()=>open({floor:3,x:360});document.getElementById('win').onclick=()=>{if(view?.s.floor===3){view.s.boss.hp=0;resume();}};document.getElementById('shoot').onclick=()=>{const w=frame.contentWindow;resume();w.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyJ',key:'j'}));setTimeout(()=>w.dispatchEvent(new w.KeyboardEvent('keyup',{code:'KeyJ',key:'j'})),1000);};open();
</script></html>
