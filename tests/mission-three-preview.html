<!doctype html><html lang="es"><meta charset="utf-8"><title>QA Misión 3 · aislado</title><style>body{margin:0;background:#15232e;color:white;font:14px sans-serif}nav{padding:7px}button{margin:4px;padding:7px}iframe{width:100%;height:calc(100vh - 94px);border:0}output{display:block}</style><nav><button id="intro">Introducción</button><button id="deck">Cubierta</button><button id="boss">Mecha</button><button id="victory">Derrotar mecha</button><button id="robot">Robot</button><button id="fire">Disparo doble</button><output id="status">Prueba aislada en 4186. No modifica 4173.</output></nav><iframe id="game"></iframe><script>
if(location.port!=='4186')throw Error('Usar servidor de pruebas 4186');const frame=document.getElementById('game'),status=document.getElementById('status');let view;
function seed(x,robot=false,intro=false){sessionStorage.setItem('cap-dollar.selected-profile.v1','1');localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,zombieUnlocked:true,robotUnlocked:robot,levels:{jump:3},owned:['heal'],equipped:'heal',wallet:9000,earned:9000}));localStorage.setItem('cap-dollar.mission-three.v1',JSON.stringify({x,landed:!intro,hp:8,form:robot?'robot':'soldier',robotUnlocked:robot,zombieUnlocked:true,inventory:{owned:[1,3,4,5,6],selected:5,secondary:3,ammo:{3:300,4:50,5:500,6:50}},defeated:[],mecha:{defeated:false}}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:3}));localStorage.removeItem('cap-dollar.mission-one-loadout.v1');}
async function open(x=250,robot=false,intro=false){view=null;if(frame.contentWindow.ArcadeDeveloperMode)frame.contentWindow.dispatchEvent(new Event('pagehide'));frame.srcdoc='';await new Promise(r=>setTimeout(r,80));seed(x,robot,intro);let html=await(await fetch('/level-three.html')).text();html=html.replace('<head>','<head><base href="/">');html=html.replace('<script src="level-three-game.js"></'+'script>','<script>const original=ArcadeLevelThreeRenderer.create;ArcadeLevelThreeRenderer.create=(images)=>{const renderer=original(images);return{draw(c,s,cam,w,h,loadout){parent.capture(s,images);renderer.draw(c,s,cam,w,h,loadout);}}};</'+'script><script src="level-three-game.js"></'+'script>');frame.srcdoc=html;}
window.capture=(s,images)=>{view=s;view.combat.invincible=999;view.combat.hp=view.combat.maxHp;status.textContent='x '+s.player.x.toFixed(0)+' · '+s.player.form+' · '+s.mecha.phase+' · HP '+s.mecha.hp+' · robot '+s.player.robotUnlocked+' · balas '+s.combat.bullets.filter(b=>!b.enemy).length;};
frame.onload=()=>{const w=frame.contentWindow;setTimeout(()=>w.document.getElementById('menu-play')?.click(),300);};
document.getElementById('intro').onclick=()=>open(160,false,true);document.getElementById('deck').onclick=()=>open(2450);document.getElementById('boss').onclick=()=>open(6430);document.getElementById('robot').onclick=()=>open(380,true);document.getElementById('victory').onclick=()=>{if(view){view.mecha.active=true;view.mecha.hp=0;}};
document.getElementById('fire').onclick=()=>{const w=frame.contentWindow;w.document.getElementById('play-two')?.click();w.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyJ',key:'j'}));setTimeout(()=>w.dispatchEvent(new w.KeyboardEvent('keyup',{code:'KeyJ',key:'j'})),300);};open(250);
</script></html>
