<!doctype html><html lang="es"><meta charset="utf-8"><title>QA Nueva York · aislada</title><style>body{margin:0;background:#17202c;color:white;font:13px sans-serif}nav{padding:5px}button{margin:3px;padding:7px}iframe{width:100%;height:calc(100vh - 92px);border:0}output{display:block}</style><nav><button data-zone="0">Manhattan</button><button data-zone="1">Midtown</button><button data-zone="2">Plaza final</button><button id="cross">Cruce y policías</button><button id="walk">Avanzar corriendo</button><button id="next">Siguiente distrito</button><button id="fire">Disparar</button><button id="hurt">Vencer fase actual</button><button id="climb">Ver subida</button><button id="resume">Continuar prueba</button><output id="status"></output></nav><iframe id="game"></iframe><script>
if(location.port!=='4186')throw Error('Solo QA 4186');const frame=document.getElementById('game');let view,freezeClimb=false;async function open(floor=0){view=null;freezeClimb=false;await new Promise(r=>{frame.addEventListener('load',r,{once:true});frame.srcdoc='';});sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');const carry={version:1,level:8,score:0,hp:8,form:'soldier',robotUnlocked:true,zombieUnlocked:true,tankUnlocked:true,fighterUnlocked:true,inventory:{owned:[1,2,3,4,5,6,7,8,9],selected:5,secondary:5,ammo:{3:300,4:100,5:900,6:60,7:100,8:50,9:50}}};localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify(carry));localStorage.setItem('obra10.progress.v1',JSON.stringify({...carry,wallet:0,earned:0,owned:['wave','alien'],equipped:'alien',levels:{jump:3}}));localStorage.setItem('cap-dollar.mission-eight.v1',JSON.stringify({...carry,newYork:{started:true,floor,x:floor===2?350:550,y:472,recruited:floor===2?['police-1-0','police-1-1']:[]}}));let html=await(await fetch('/level-eight.html')).text();html=html.replace('<head>','<head><base href="/">');const hook='const old=ArcadeNewYorkRenderer.create;ArcadeNewYorkRenderer.create=images=>{const r=old(images);return{...r,draw(c,s,p,e,powers,profile){parent.capture(s,p,e,powers,profile);r.draw(c,s,p,e,powers,profile);}}};';html=html.replace('<script src="level-eight-game.js"></'+'script>','<script>'+hook+'</'+'script><script src="level-eight-game.js"></'+'script>');frame.srcdoc=html;}
window.capture=(s,p,e,powers,profile)=>{view={s,p,e,powers,profile};e.invincible=999;if(freezeClimb&&s.boss.phase==='climb'){s.boss.age=.8;s.boss.y=384;}document.getElementById('status').textContent='M8 distrito '+s.floor+' · x '+Math.round(p.x)+' · '+s.boss.phase+' · fase '+s.boss.stage+' · HP jefe '+s.boss.hp.toFixed(1)+' · aliados '+s.recruited.size+' · final '+s.ending.toFixed(1);};
frame.onload=()=>{const timer=setInterval(()=>{const b=frame.contentWindow.document.getElementById('menu-play');if(b&&!b.disabled){clearInterval(timer);b.click();}},100);setTimeout(()=>clearInterval(timer),9000);};const resume=()=>frame.contentWindow.document.getElementById('play-two')?.click();const key=(code,time=250)=>{resume();const w=frame.contentWindow;w.dispatchEvent(new w.KeyboardEvent('keydown',{code,key:code,repeat:false}));setTimeout(()=>w.dispatchEvent(new w.KeyboardEvent('keyup',{code,key:code})),time);};document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>open(+b.dataset.zone));document.getElementById('resume').onclick=()=>{freezeClimb=false;resume();};document.getElementById('cross').onclick=()=>{view.p.x=1100;view.p.y=472;resume();};document.getElementById('walk').onclick=()=>{key('ShiftLeft',4000);key('ArrowRight',4000);};document.getElementById('fire').onclick=()=>key('KeyJ',1500);document.getElementById('hurt').onclick=()=>{view.s.boss.hp=0;view.s.boss.active=true;resume();};document.getElementById('climb').onclick=()=>{freezeClimb=true;view.s.boss.hp=0;view.s.boss.active=true;resume();};document.getElementById('next').onclick=()=>{view.p.x=frame.contentWindow.ArcadeNewYorkWorld.widths[view.s.floor]-150;view.p.y=472;view.p.grounded=true;key('ArrowUp');};open();
</script></html>
