<!doctype html><html lang="es"><meta charset="utf-8"><title>Animaciones de poderes</title><style>body{background:#15222c;color:#d7e6e8;font:16px system-ui;margin:20px}canvas{max-width:100%;image-rendering:pixelated}button{padding:12px}</style><h1>Poderes · hoja de sprites integrada</h1><p>Vista de comprobación de los ocho efectos. No cambia puntos ni compras.</p><canvas id="preview" width="1000" height="560"></canvas>
<script src="/power-sprites.js"></script><script>
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),img=new Image();img.src='/assets/sprites/poderes-v1.png';img.onload=()=>{ArcadePowerSprites.setSpriteSheet(img);requestAnimationFrame(draw);};
function draw(now){const age=now/1000,V=ArcadePowerSprites,names=['Lanzallamas','Dron bomba','Torreta 360°','Onda expansiva','Congelación','Curación','Ataque orbital','Escudo / impacto'];ctx.clearRect(0,0,1000,560);ctx.imageSmoothingEnabled=false;for(let i=0;i<8;i++){const x=(i%4)*250+125,y=Math.floor(i/4)*280+145;ctx.fillStyle='#21343e';ctx.fillRect(x-120,y-120,240,260);ctx.fillStyle='#ffd175';ctx.fillText(names[i],x-105,y-98);const f=V.frame(age,8);if(i===0)V.flame(ctx,{x:x-65,y:y+30,aim:{x:1,y:0}},age);else if(i===2)V.turret(ctx,{x,y:y+25,angle:Math.sin(age)*1.2,flash:(age%.4)<.16?.16-age%.4:0});else{const k=['flame','drone','turret','wave','cryo','heal','orbital','shield'][i];V.draw(ctx,k,f,x,y, i===6?110:150,i>=5?200:150);}}requestAnimationFrame(draw);}
</script></html>
