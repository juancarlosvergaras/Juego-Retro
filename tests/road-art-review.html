const c=document.querySelector('canvas').getContext('2d');let run=true,t=0,last=0,jump=false,shoot=false;document.getElementById('animate').onclick=()=>run=!run;document.getElementById('jump').onclick=()=>jump=!jump;document.getElementById('shoot').onclick=()=>shoot=!shoot;

 document.getElementById('status').textContent='6 formas · 3 enemigos · rampa de 200 px · hueco de agua de 116 px · recogibles originales';requestAnimationFrame(loop);
 }requestAnimationFrame(loop);
}).catch(e=>document.getElementById('status').textContent=e.stack);
