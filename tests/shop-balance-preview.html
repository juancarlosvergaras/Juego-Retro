<!doctype html><html lang="es"><meta charset="utf-8"><title>Tienda · saldo por perfil</title><style>body{background:#18282c;color:#fff;font:14px sans-serif}button{padding:8px;margin:4px}iframe{width:100%;height:790px;border:0}</style><h1>Prueba aislada de compras</h1><p>Saldo inicial: 2.500 puntos. Puntuación histórica: 20.000.</p><button data-mission="2">Misión 2</button><button data-mission="1">Misión 1</button><button id="reload">Continuar con saldo guardado</button><pre id="saved"></pre><iframe id="game" title="Tienda del juego"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado');const frame=document.getElementById('game');let mission=2;
sessionStorage.setItem('cap-dollar.selected-profile.v1','1');localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');
const route=()=>mission===2?'/level-two.html?entry=resume':'/index.html?entry=select';
for(const b of document.querySelectorAll('[data-mission]'))b.onclick=async()=>{await new Promise(r=>{frame.addEventListener('load',r,{once:true});frame.src='about:blank';});mission=Number(b.dataset.mission);localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,wallet:2500,earned:20000,levels:{},owned:[],shield:99}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:mission,score:20000}));localStorage.setItem('cap-dollar.mission-two.v1',JSON.stringify({x:240,landed:true,hp:8,shield:99,score:20000,inventory:{selected:3,owned:[1,3],ammo:{3:36}}}));frame.src=route();};
document.getElementById('reload').onclick=()=>frame.src=route();setInterval(()=>{const p=JSON.parse(localStorage.getItem('obra10.progress.v1')||'{}');document.getElementById('saved').textContent='Guardado: '+JSON.stringify({wallet:p.wallet,earned:p.earned,levels:p.levels});},300);document.querySelector('[data-mission="2"]').click();
</script></html>
