<!doctype html><html lang="es"><meta charset="utf-8"><title>Dirigible y zombi · prueba</title><style>body{background:#17272c;color:#fff;font:14px system-ui}button{padding:7px;margin:4px}iframe{width:100%;height:720px;border:0}pre{max-height:110px;overflow:auto}</style><h1>Dirigible y zombi · origen aislado</h1><button data-scene="tower">Edificio alto</button><button data-scene="ship">Dirigible</button><button data-scene="zombie">Zombi</button><button data-action="run">Correr</button><button data-action="down">Enterrar</button><button data-action="jump">Emerger</button><button data-action="fire">Rayo</button><button data-action="collect">Recoger jetpack</button><button data-action="fly">Volar MK II</button><pre id="status"></pre><iframe id="game" title="Partida aislada"></iframe><script>
if(location.port!=='4186')throw Error('Solo origen aislado');const frame=document.getElementById('game');let scene='tower',observed={},placed=false,lastInput={};
for(const button of document.querySelectorAll('[data-scene]'))button.onclick=async()=>{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src='about:blank';});scene=button.dataset.scene;observed={};placed=false;localStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.setItem('cap-dollar.selected-profile.v1','1');sessionStorage.removeItem('cap-dollar.dev-session.v1');localStorage.setItem('obra10.progress.v1',JSON.stringify({version:1,zombieUnlocked:true,levels:{life:5,jump:5,jet:5},owned:[]}));localStorage.setItem('cap-dollar.campaign.v1',JSON.stringify({version:1,level:2}));localStorage.setItem('cap-dollar.mission-two.v1',JSON.stringify({inside:false,x:scene==='tower'?9530:scene==='ship'?8890:10200,landed:true,hp:13,fuel:4000,form:scene==='zombie'?'zombie':'soldier',defeated:[...Array.from({length:26},(_,i)=>i),...Array.from({length:20},(_,i)=>100+i),...Array.from({length:6},(_,i)=>200+i)],tank:{hp:0},inventory:{selected:3,owned:[1,3],ammo:{3:300}}}));frame.src='/level-two.html?entry=resume';};
frame.onload=()=>{const w=frame.contentWindow,V=w.ArcadePowers;if(!V)return;const P=w.ArcadePhysics,step=P.step;P.step=(p,input,...rest)=>{if(!p.kind)lastInput=input;return step(p,input,...rest);};const cp=w.ArcadeCheckpoints,cpdraw=cp.draw;cp.draw=(c,s,inside,time,view)=>{frame.dataset.camera=JSON.stringify({...view,matrix:c.getTransform().toString()});return cpdraw(c,s,inside,time,view);};const R=w.ArcadeLevelTwoRenderer,create=R.create;R.create=(images)=>{const renderer=create(images),draw=renderer.draw;renderer.draw=(c,s,cam,...args)=>{frame.dataset.camera=JSON.stringify(cam);return draw(c,s,cam,...args);};return renderer;};const update=V.update;V.update=(powers,e,p,profile,input,dt,platforms,view)=>{observed={p,e,profile};e.invincible=100;p.hurt=0;for(const n of e.enemies)if(n.id===900)n.frozen=100;if(!placed){placed=true;if(scene!=='zombie'){const deck=scene==='ship'?platforms.find(s=>s.airship):platforms.filter(s=>s.building===14).at(-1);Object.assign(p,{y:deck.y,ground:deck,grounded:true,vx:0,vy:0,fallPeak:deck.y});}else{const n=w.ArcadeEnemies.createSoldier({x:10430,y:620},900);n.hp=n.maxHp=100;n.frozen=100;e.enemies.push(n);}}const result=update(powers,e,p,profile,input,dt,platforms,view);document.getElementById('status').textContent=JSON.stringify({scene,input:lastInput,hurt:p.hurt,ground:p.ground?.kind,form:p.form,time:p.anim,camera:frame.dataset.camera,x:Math.round(p.x),y:Math.round(p.y),buried:!!p.burrow,emerging:p.emerging,jetpack:p.jetpack,mk2:p.jetpackMk2,vx:Math.round(p.vx),vy:Math.round(p.vy),electric:(e.zombieEffects||[]).some(f=>f.kind==='electrocute'),saved:JSON.parse(localStorage.getItem('obra10.progress.v1')||'{}').jetpackMk2},null,1);return result;};};
for(const button of document.querySelectorAll('[data-action]'))button.onclick=()=>{const w=frame.contentWindow,d=w.document;if(!d.getElementById('level-two-menu').hidden)d.getElementById('play-two').click();d.getElementById('level-two').focus();const action=button.dataset.action,actions=action==='run'?['right','run']:action==='collect'?['right']:action==='fly'?['jet','up']: [action];w.ArcadeControls.setTouch('sky-qa',actions);setTimeout(()=>w.ArcadeControls.setTouch('sky-qa',[]),action==='run'?700:action==='collect'?850:action==='fly'?750:action==='fire'?1800:action==='down'?800:80);};document.querySelector('[data-scene="tower"]').click();
</script></html>
