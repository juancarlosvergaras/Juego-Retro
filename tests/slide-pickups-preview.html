<!doctype html><meta charset="utf-8"><style>body{background:#263342;color:white;font:16px monospace}canvas{image-rendering:pixelated;max-width:100%}</style><p>Deslizamiento: entrada, impulso y recuperación · Armas para recoger</p><canvas width="1100" height="360"></canvas><script src="../slide-atlas.js"></script><script src="../soldier-animation.js"></script><script src="../weapon-renderer.js"></script><script>const c=document.querySelector('canvas').getContext('2d'),im=new Image();im.onload=()=>{c.imageSmoothingEnabled=false;for(let i=0;i<6;i++){const [x,y,w,h]=SLIDE_FRAMES[0][i],s=SLIDE_SCALE*2.5;c.drawImage(im,x,y,w,h,80+i*180-w*s/2,165-h*s,w*s,h*s);}for(let i=1;i<=9;i++){c.save();c.translate(60+(i-1)*120,280);c.scale(2.5,2.5);ArcadeWeaponRenderer.pickup(c,i,0,0);c.restore();c.fillStyle='#ffe1a1';c.fillText(i,57+(i-1)*120,330);}};im.src='../assets/sprites/soldado-deslizamiento-v1.png';</script>
