<!doctype html><html lang="es"><meta charset="utf-8"><title>Soldado nuevo: animaciones</title><style>body{background:#182a3a;color:#ddd;font:16px monospace}canvas{image-rendering:pixelated}</style><p>Caminar · correr · disparar · arriba · diagonal · caer</p><canvas width="1080" height="400"></canvas><script src="../soldier-v2-atlas.js"></script><script src="../soldier-animation.js"></script><script src="../weapon-renderer.js"></script><script>const c=document.querySelector('canvas').getContext('2d'),img=new Image();img.src='../assets/sprites/soldado-v2.png';img.onload=()=>requestAnimationFrame(draw);function draw(t){c.clearRect(0,0,1080,400);c.imageSmoothingEnabled=false;for(let i=0;i<6;i++){const p={x:0,y:0,anim:t/1000,walkCycle:t/1000*(i===1?2.5:1.7),vx:i<2?(i===1?235:145):0,vy:i===5?300:0,grounded:i!==5,facing:1,aimHeight:28,aim:i===3?{x:0,y:-1}:i===4?{x:.707,y:-.707}:{x:1,y:0}},e={inventory:{selected:3},weaponAction:{slot:3,age:.04,duration:.35}};const pose=ArcadeSoldierAnimation.pose(p,{},e),[x,y,w,h]=SOLDIER_V2_FRAMES[pose.row][pose.frame],s=SOLDIER_V2_SCALE;c.save();c.translate(75+i*175,220);c.scale(2.5,2.5);c.drawImage(img,x,y,w,h,-w*s/2,-h*s,w*s,h*s);if(pose.armed)ArcadeWeaponRenderer.draw(c,p,e);c.restore();}requestAnimationFrame(draw);}</script></html>
