<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Transformación · Cap Dollar</title><style>body{background:#182636;color:#e6dab9;font:14px monospace;margin:30px}main{display:flex;flex-wrap:wrap;gap:8px}figure{margin:0;text-align:center}canvas{image-rendering:pixelated;border-bottom:2px solid #6c7982;background:#263849}#loop{margin-top:30px}</style></head><body><h1>Soldado → lobo → soldado</h1><main id="frames"></main><canvas id="loop" width="240" height="170"></canvas><p id="status">Cargando</p><script src="../soldier-v2-atlas.js"></script><script src="../action-atlas.js"></script><script src="../soldier-animation.js"></script><script>
const paths={soldier:'soldado-v2.png',wolf:'soldado-lobo-v1.png',transformation:'soldado-transformacion-v2.png'},images={};
Promise.all(Object.entries(paths).map(([k,path])=>new Promise((resolve,reject)=>{const image=new Image();images[k]=image;image.onload=resolve;image.onerror=reject;image.src='../assets/sprites/'+path;}))).then(()=>{
 function draw(canvas,index){const ctx=canvas.getContext('2d'),pose=ArcadeSoldierAnimation.transformation(index),frames=pose.sheet==='soldier'?SOLDIER_V2_FRAMES:pose.sheet==='wolf'?ACTION_FRAMES.wolf:ArcadeSoldierAnimation.transformationFrames;const [x,y,w,h]=frames[pose.row][pose.frame],s=pose.scale*2;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(images[pose.sheet],x,y,w,h,canvas.width/2-w*s/2,155-h*s,w*s,h*s);}
 for(let i=0;i<8;i++){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),label=document.createElement('figcaption');canvas.width=155;canvas.height=170;label.textContent=i===0?'Soldado original':i===7?'Lobo original':'Transición '+i;figure.append(canvas,label);document.getElementById('frames').append(figure);draw(canvas,i);}
 function loop(t){const cycle=Math.floor(t/150)%20,index=cycle<8?cycle:cycle<10?7:cycle<18?17-cycle:0;draw(document.getElementById('loop'),index);requestAnimationFrame(loop);}requestAnimationFrame(loop);document.getElementById('status').textContent='8 fotogramas · Ambos sentidos · Escala del juego ×2';
});</script></body></html>
