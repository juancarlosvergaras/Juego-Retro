<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba visual de armas</title><style>body{background:#162630;color:#eee;font:16px monospace}canvas{image-rendering:pixelated}</style><p>Armas: agarre, izquierda, arriba, diagonal y agachado</p><canvas id="preview" width="1050" height="720"></canvas><script src="../sprite-atlas.js"></script><script src="../weapon-renderer.js"></script><script>const c=document.querySelector('canvas').getContext('2d'),img=new Image();img.src='../assets/sprites/soldado-v1.png';img.onload=()=>requestAnimationFrame(draw);function draw(t){c.clearRect(0,0,1050,720);c.imageSmoothingEnabled=false;for(let slot=1;slot<=9;slot++)for(let pose=0;pose<4;pose++){const a=[{x:1,y:0},{x:-1,y:0},{x:0,y:-1},{x:.707,y:.707}][pose];const p={x:0,y:0,facing:pose===1?-1:1,aim:a,aimHeight:pose===3?20:28,anim:t/1000,vx:0,grounded:true};const e={inventory:{selected:slot},lastAim:a,weaponAction:{slot,age:(t/1000)%1.2,duration:.7}};c.save();c.translate(55+(slot-1)%3*345+pose*78,170+Math.floor((slot-1)/3)*235);c.scale(1.9,1.9);ArcadeWeaponRenderer.draw(c,p,e,img,SOLDIER_FRAMES,pose===3?6:0,pose===3?4:0,.39);c.restore();c.fillStyle='#eee';c.fillText(String(slot),15+(slot-1)%3*345,35+Math.floor((slot-1)/3)*235);}requestAnimationFrame(draw);}</script></html>
