<!doctype html><meta charset="utf-8"><title>Comparación de personajes</title><style>body{background:#263a4b;color:white;font:16px sans-serif}canvas{image-rendering:pixelated;width:100%;max-width:1100px}</style><h1>Soldado y trabajadores · misma escala del juego</h1><canvas width="660" height="190"></canvas><script src="/soldier-v2-atlas.js"></script><script src="/worker-atlas.js"></script><script>
const soldier=new Image(),worker=new Image();Promise.all([new Promise(r=>soldier.onload=r),new Promise(r=>worker.onload=r)]).then(()=>{const c=document.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#b6ab87';c.fillRect(0,159,660,2);const f=SOLDIER_V2_FRAMES[0][0],scale=SOLDIER_V2_SCALE*2;c.drawImage(soldier,...f,55-f[2]*scale/2,160-f[3]*scale,f[2]*scale,f[3]*scale);WORKER_FRAMES.filter((_,i)=>[0,2,5,8,10,13].includes(i)).forEach((f,i)=>{const k=92/f[3];c.drawImage(worker,...f,145+i*91-f[2]*k/2,160-92,f[2]*k,92);});});soldier.src='/assets/sprites/soldado-v2.png';worker.src='/assets/sprites/trabajadores-descanso-huida-v3.png';</script>
