<!doctype html><meta charset="utf-8"><title>Carrera de trabajadores</title><style>body{background:#304155;color:white;font:16px sans-serif}canvas{width:100%;image-rendering:pixelated}</style><h2>Carrera · ocho pasos sincronizados con el desplazamiento</h2><canvas width="800" height="190"></canvas><script src="/ambience.js"></script><script src="/worker-atlas.js"></script><script>const image=new Image();image.onload=()=>{ArcadeAmbience.setWorkerSheet(image,[]);ArcadeAmbience.setWorkerRunSheet(image,WORKER_RUN_FRAMES,WORKER_RUN_SCALE);const s=ArcadeAmbience.create([],160);s.workers.forEach((w,i)=>Object.assign(w,{x:100+i*90,phase:'run',dir:i===0?-1:1}));s.workersAlerted=true;const c=document.querySelector('canvas').getContext('2d');let last;function tick(t){const dt=last?Math.min(.03,(t-last)/1000):0;last=t;ArcadeAmbience.update(s,dt);s.workers.forEach(w=>{if(w.x>760){w.x=30;w.done=false;}if(w.x<0){w.x=740;w.done=false;}});c.clearRect(0,0,800,190);c.fillStyle='#91846d';c.fillRect(0,160,800,3);ArcadeAmbience.workers(c,s);requestAnimationFrame(tick);}requestAnimationFrame(tick);};image.src='/assets/sprites/trabajadores-carrera-v4.png';</script>
