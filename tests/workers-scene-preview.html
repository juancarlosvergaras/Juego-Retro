<!doctype html><meta charset="utf-8"><title>Trabajadores · descanso y huida</title><style>body{background:#233346;color:#fff;font:16px sans-serif}canvas{width:900px;image-rendering:pixelated;display:block}</style><script src="/ambience.js"></script><script src="/worker-atlas.js"></script><script>
