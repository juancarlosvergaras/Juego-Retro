<!doctype html><html lang="es"><meta charset="utf-8"><title>Sprites del Heraldo · revisión</title><style>body{margin:0;background:#182731;color:#eee;font:14px sans-serif}canvas{display:block;image-rendering:pixelated}h1{font-size:18px;margin:12px}</style><h1>Rayos, plasma, derrota, descarga, salto y transformación</h1><canvas width="1120" height="940"></canvas><script src="../zombie-form.js"></script><script>
const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
function load(src){return new Promise(resolve=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);const d=x.getImageData(0,0,c.width,c.height);for(let a=3;a<d.data.length;a+=4)d.data[a]=d.data[a]>=200?255:0;x.putImageData(d,0,0);resolve(c)};i.src=src})}
Promise.all([load('../assets/sprites/zombi-electrico-v1.png'),load('../assets/sprites/zombi-electrico-extra-v1.png')]).then(([a,b])=>{const main=ArcadeZombieForm.setSheet(a),extra=ArcadeZombieForm.setExtra(b);[...main.rows.slice(3,5),...extra.rows].forEach((row,r)=>row.forEach((f,col)=>{const atlas=r<2?main:extra,s=atlas.scale*1.5,x=col*186+92,y=r*155+134;ctx.strokeStyle='#446';ctx.strokeRect(col*186,r*155,186,155);ctx.drawImage(atlas.image,f.x,f.y,f.w,f.h,x+(f.x-f.pivot)*s,y-f.h*s,f.w*s,f.h*s);ctx.fillStyle='#eee';ctx.fillText(`${r+1} / ${col+1}`,col*186+8,r*155+16)}))})
</script></html>
